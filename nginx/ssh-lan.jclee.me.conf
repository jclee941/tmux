# Home-LAN direct path to the web terminal (tmux-web-gateway on 127.0.0.1:7681).
# From the home network ssh.jclee.me lands on Cloudflare's LAX edge and then
# hops back to the ICN tunnel connector (0.9 s for a bare 401 on 2026-11-04),
# so LAN clients use https://ssh-lan.jclee.me (A -> 192.168.50.200, DNS only).
# Home-LAN clients (192.168.50.0/24) get no login prompt: nginx adds the
# gateway/ttyd Basic auth for them (snippets/ssh-lan-auth.conf); nothing else
# may connect. ssh.jclee.me through Cloudflare still asks for it.
# Cert: certbot DNS-01 (/etc/letsencrypt/cloudflare.ini), renewed by
# certbot.timer; renewal-hooks/deploy/reload-nginx reloads this server.
include snippets/ssh-lan-auth.conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 192.168.50.200:443 ssl;
    server_name ssh-lan.jclee.me;

    ssl_certificate     /etc/letsencrypt/live/ssh-lan.jclee.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssh-lan.jclee.me/privkey.pem;

    allow 192.168.50.0/24;
    allow 127.0.0.1;
    deny all;

    # The gateway caps each dropped file at 100 MB.
    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $ssh_lan_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}