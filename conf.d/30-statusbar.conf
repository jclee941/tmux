# ~/.tmux/conf.d/30-statusbar.conf - Status bar (split from theme)
set -g status 2
set -g status-position bottom
set -g status-style 'bg=#1a1b26 fg=#a9b1d6'

# Line 1: Clickable session tabs + "+" button
# Two-pass rendering: opencode pinned first (purple), then remaining sessions (blue)
# Zero shell forks — pure tmux format, instant rendering
set -g status-format[1] '#[align=left,bg=#16161e]#{S:#{?#{==:#{session_name},opencode},#[range=session|#{session_id}]#{?#{==:#{session_name},#{client_session}},#[fg=#1a1b26 bg=#bb9af7 bold] #{session_name} ,#[fg=#bb9af7 bg=#24283b] #{session_name} }#[norange bg=#16161e nobold]#[fg=#565f89]│,}}#{S:#{?#{==:#{session_name},opencode},,#[range=session|#{session_id}]#{?#{==:#{session_name},#{client_session}},#[fg=#1a1b26 bg=#3d59a1 bold] #{session_name} ,#[fg=#a9b1d6 bg=#1a1b26] #{session_name} }#[norange bg=#16161e nobold]}}#[fg=#3b4261]│#[range=user|new-session fg=#7aa2f7 bg=#24283b] + #[norange bg=#16161e]#[align=right]#(~/.tmux/bin/tmux-host-stats --local --push dev)#(~/.tmux/bin/tmux-host-stats --remote 192.168.50.220 --push prd)#[fg=#7dcfff,bg=#16161e,nobold]#[fg=#1a1b26,bg=#7dcfff,bold] [DEV] #[fg=#7dcfff,bg=#24283b]#[fg=#565f89,bg=#24283b,bold] CPU:#{?#{e|>=:#{@dev_cpu},70},#[fg=#f7768e bold],#[fg=#c0caf5]}#{@dev_cpu_p}#[fg=#565f89,nobold]%#[fg=#565f89,bg=#24283b,bold] MEM:#{?#{e|>=:#{@dev_mem},70},#[fg=#f7768e bold],#[fg=#c0caf5]}#{@dev_mem_p}#[fg=#565f89,nobold]%#[fg=#565f89,bg=#24283b,bold] DISK:#{?#{e|>=:#{@dev_disk},70},#[fg=#f7768e bold],#[fg=#c0caf5]}#{@dev_disk_p}#[fg=#565f89,nobold]% #[fg=#24283b,bg=#16161e,nobold] #[fg=#e0af68,bg=#16161e]#[fg=#1a1b26,bg=#e0af68,bold] [PRD] #[fg=#e0af68,bg=#24283b]#[fg=#565f89,bg=#24283b,bold] CPU:#{?#{e|>=:#{@prd_cpu},70},#[fg=#f7768e bold],#[fg=#c0caf5]}#{@prd_cpu_p}#[fg=#565f89,nobold]%#[fg=#565f89,bg=#24283b,bold] MEM:#{?#{e|>=:#{@prd_mem},70},#[fg=#f7768e bold],#[fg=#c0caf5]}#{@prd_mem_p}#[fg=#565f89,nobold]%#[fg=#565f89,bg=#24283b,bold] DISK:#{?#{e|>=:#{@prd_disk},70},#[fg=#f7768e bold],#[fg=#c0caf5]}#{@prd_disk_p}#[fg=#565f89,nobold]%#[fg=#565f89,bg=#24283b,bold] GPU:#{?#{e|>=:#{@prd_gpu},70},#[fg=#f7768e bold],#[fg=#c0caf5]}#{@prd_gpu_p}#[fg=#565f89,nobold]% #[fg=#24283b,bg=#16161e,nobold]'

# Window Tabs (static — not affected by responsive tiers)
setw -g window-status-separator '#[fg=#1a1b26]|'

# Defaults removed — tmux-responsive is the sole source of truth.
# On headless start (no client), responsive falls back to Normal tier.

# ── Responsive statusbar (hook-based, no jitter) ──
# Runs only on actual resize events, not every status-interval
# Use -g (set, not append) to prevent hook accumulation on reload
set-hook -g client-resized 'run-shell -b "~/.tmux/bin/tmux-responsive"'
set-hook -g client-attached 'run-shell -b "~/.tmux/bin/tmux-responsive"'
set-hook -g client-session-changed 'run-shell -b "~/.tmux/bin/tmux-git-uncommitted && ~/.tmux/bin/tmux-session-branch-log"'
run-shell -b "~/.tmux/bin/tmux-responsive"
