# ~/.tmux/conf.d/30-statusbar.conf - Status bar (split from theme)
set -g status 3
set -g status-position bottom
set -g status-style 'bg=#1a1b26 fg=#a9b1d6'

# Reset the whole array first: [0] keeps tmux's default layout (status-left,
# window list, status-right) and stale [0] overrides from older configs are
# dropped. `set -gu 'status-format[0]'` would delete line 0 instead.
set -gu status-format

# Line 1: Clickable session tabs + "+" button, DEV resource pill on the right
# Line 2: PRD resource pill, right-aligned under the DEV pill
# Tabs are pure tmux format (zero shell forks, name order) inside a tmux list:
# when a client is too narrow for tabs and pill, tmux trims the tabs around
# the current session (with </> markers) instead of cutting into the pill.
# DEV and PRD sit on separate lines for the same reason. Pills are drawn for
# every client at least 40 columns wide (tmux-responsive's Normal and Compact
# tiers); below 80 columns they switch to one-letter labels (41 cells), so a
# ~60-column phone keeps both pills next to its tabs. Each pill's #() push
# job runs only while such a client draws it.
# Both pills are right-aligned, so the DEV pill ends with blank cells as wide
# as PRD's extra GPU field plus its trailing space (10 cells, 8 compact) to
# keep every column lined up.
set -g status-format[1] '#[align=left,bg=#16161e]#[list=on]#[list=left-marker]<#[list=right-marker]>#[list=on]#{S:#[range=session|#{session_id}]#{?#{==:#{session_name},#{client_session}},#[list=focus fg=#1a1b26 bg=#3d59a1 bold] #{session_name} ,#[fg=#a9b1d6 bg=#1a1b26] #{session_name} }#[norange list=on bg=#16161e nobold]}#[fg=#3b4261]│#[range=user|new-session fg=#7aa2f7 bg=#24283b] + #[norange bg=#16161e]#[nolist align=right]#{?#{e|>=:#{client_width},40},#(~/.tmux/bin/tmux-host-stats --local --push dev)#[fg=#7dcfff bg=#16161e nobold]#[fg=#1a1b26 bg=#7dcfff bold]#{?#{e|<:#{client_width},80}, DEV , [DEV] }#[fg=#7dcfff bg=#24283b]#[fg=#565f89 bg=#24283b bold]#{?#{e|<:#{client_width},80}, C:, CPU:}#{?#{e|>=:#{@dev_cpu},70},#[fg=#f7768e bold],#[fg=#c0caf5]}#{@dev_cpu_p}#[fg=#565f89 nobold]%#[fg=#565f89 bg=#24283b bold]#{?#{e|<:#{client_width},80}, S:, ST:}#{?#{e|>=:#{@dev_steal},10},#[fg=#f7768e bold],#[fg=#c0caf5]}#{@dev_steal_p}#[fg=#565f89 nobold]%#[fg=#565f89 bg=#24283b bold]#{?#{e|<:#{client_width},80}, M:, MEM:}#{?#{e|>=:#{@dev_mem},70},#[fg=#f7768e bold],#[fg=#c0caf5]}#{@dev_mem_p}#[fg=#565f89 nobold]%#[fg=#565f89 bg=#24283b bold]#{?#{e|<:#{client_width},80}, D:, DISK:}#{?#{e|>=:#{@dev_disk},70},#[fg=#f7768e bold],#[fg=#c0caf5]}#{@dev_disk_p}#[fg=#565f89 nobold]%        #{?#{e|<:#{client_width},80},,  }#[fg=#24283b bg=#16161e nobold],}'
set -g status-format[2] '#[align=right]#{?#{e|>=:#{client_width},40},#(~/.tmux/bin/tmux-host-stats --remote 192.168.50.220 --push prd)#[fg=#e0af68 bg=#16161e]#[fg=#1a1b26 bg=#e0af68 bold]#{?#{e|<:#{client_width},80}, PRD , [PRD] }#[fg=#e0af68 bg=#24283b]#[fg=#565f89 bg=#24283b bold]#{?#{e|<:#{client_width},80}, C:, CPU:}#{?#{e|>=:#{@prd_cpu},70},#[fg=#f7768e bold],#[fg=#c0caf5]}#{@prd_cpu_p}#[fg=#565f89 nobold]%#[fg=#565f89 bg=#24283b bold]#{?#{e|<:#{client_width},80}, S:, ST:}#{?#{e|>=:#{@prd_steal},10},#[fg=#f7768e bold],#[fg=#c0caf5]}#{@prd_steal_p}#[fg=#565f89 nobold]%#[fg=#565f89 bg=#24283b bold]#{?#{e|<:#{client_width},80}, M:, MEM:}#{?#{e|>=:#{@prd_mem},70},#[fg=#f7768e bold],#[fg=#c0caf5]}#{@prd_mem_p}#[fg=#565f89 nobold]%#[fg=#565f89 bg=#24283b bold]#{?#{e|<:#{client_width},80}, D:, DISK:}#{?#{e|>=:#{@prd_disk},70},#[fg=#f7768e bold],#[fg=#c0caf5]}#{@prd_disk_p}#[fg=#565f89 nobold]%#[fg=#565f89 bg=#24283b bold]#{?#{e|<:#{client_width},80}, G:, GPU:}#{?#{e|>=:#{@prd_gpu},70},#[fg=#f7768e bold],#[fg=#c0caf5]}#{@prd_gpu_p}#[fg=#565f89 nobold]% #[fg=#24283b bg=#16161e nobold],}'

# Window Tabs (static — not affected by responsive tiers)
setw -g window-status-separator '#[fg=#1a1b26]|'

# Defaults removed — tmux-responsive is the sole source of truth.
# Its formats pick the tier per client from #{client_width} at draw time.

# ── Responsive statusbar (per client) ──
# Tier formats branch on #{client_width} at draw time, so resizes need no
# hook; client-attached refreshes the per-client SSH/MOSH tags.
# Use -g (set, not append) to prevent hook accumulation on reload
set-hook -g client-attached 'run-shell -b "~/.tmux/bin/tmux-responsive"'
set-hook -g client-session-changed 'run-shell -b "~/.tmux/bin/tmux-git-uncommitted && ~/.tmux/bin/tmux-session-branch-log"'
run-shell -b "~/.tmux/bin/tmux-responsive"
