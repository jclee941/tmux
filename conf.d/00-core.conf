# ~/.tmux/conf.d/00-core.conf - Terminal, performance, basics

# ── Terminal & Colors ──
set -g default-terminal "tmux-256color"
# Terminal overrides: RGB + undercurl + key fixes (set -g replaces, -ga appends)
set -g terminal-overrides ",*256col*:RGB:Smulx=\\E[4::%p1%dm:Setulc=\\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"
set -ga terminal-overrides ",xterm*:RGB:khome=\\E[1~:kend=\\E[4~"
set -ga terminal-overrides ",wezterm:RGB:Tc"
# Detached panes cannot answer OSC color probes. Advertise the known terminal
# capabilities so TUIs do not fall back to a light 256-color palette.
set-environment -g COLORTERM truecolor
set-environment -g COLORFGBG '15;0'

# ── Terminal Features (undercurl, styled underlines) ──
set -g terminal-features ',*:usstyle'
# ttyd/xterm.js exposes no `Ms` capability, so tmux never derives the
# `clipboard` feature and silently suppresses OSC 52 even with
# `set-clipboard on`. Declare it so yanks reach the browser clipboard via the
# OSC 52 bridge injected by bin/tmux-web-terminal.
set -ga terminal-features ',*:clipboard'

# ── Performance ──
set -g escape-time 0
set -g focus-events on
# Forward modified Enter keys (Shift+Enter, etc.) to OMO.
set -g extended-keys on
setw -g allow-passthrough on

# ── Buffer Limits ──
set -g message-limit 400
set -g buffer-limit 50

# ── Window Behavior ──
set -g allow-rename off
# Keep full-screen TUIs aligned with the most recently active client on resize.
setw -g window-size latest
set -g activity-action none
set -g bell-action none

# ── Availability (prevent accidental session loss) ──
set -g detach-on-destroy off       # When session killed, switch to another instead of detach
set -g exit-empty off              # Keep server alive even with no sessions
set -g exit-unattached off         # Keep server alive when no clients attached
set -g destroy-unattached off      # Don't kill sessions when client detaches

# ── Mosh Compatibility ──
setw -g aggressive-resize on
set -g status-interval 5

# ── Locale Propagation (CJK/Korean text rendering) ──
# Ensure locale env vars propagate on client reattach (prevents garbled Korean)
set -g update-environment 'DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY LANG LC_ALL LC_CTYPE MOSH_KEY'

# ── Display ──
set -g display-time 2000            # Show messages for 2s (default 750ms too short)
set -g display-panes-time 2000      # Show pane numbers for 2s

# ── Mouse ──
set -g mouse on

# ── Clipboard ──
# OSC 52 — works through mosh/SSH tunnels
set -g set-clipboard on

# ── Scrollback ──
set -g history-limit 50000

# ── Indexing ──
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
