# ~/.tmux/conf.d/90-plugins.conf - TPM plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ── Resurrect: save/restore sessions across restarts ──
# Pane contents stay OFF: capturing them dumps the whole scrollback back into
# every pane on restore, so a reboot lands on a frozen snapshot of the old
# screen instead of a clean prompt. It was also what made auto-save expensive
# (a single capture produced a 971 KB tarball). Layout/cwd/process restore is
# unaffected — only the replayed screen text is dropped.
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'vim nvim man less more tail top htop watch ssh mosh'

# ── Continuum: periodic auto-save OFF, auto-restore on tmux start ──
# Continuum's only auto-save mechanism is prepending continuum_save.sh into
# status-right. bin/tmux-responsive owns status-right and rewrites it on every
# client-resized / client-attached hook, so that interpolation is stripped and
# a periodic save can never fire in this config — which is why the restore
# point sat at 2026-06-01 and every boot replayed a months-old snapshot.
# Freshness comes from systemd/tmux-resurrect-save.service (save on shutdown)
# plus prefix+S, not from an interval that silently does nothing.
set -g @continuum-save-interval '0'
set -g @continuum-restore 'on'
# @continuum-boot omitted — systemd tmux-server.service handles this

# ── Initialize TPM (MUST be last line) ──
run '~/.tmux/plugins/tpm/tpm'
