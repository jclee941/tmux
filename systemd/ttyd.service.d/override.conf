[Service]
# Run ttyd and its tmux clients as the tmux server owner. Starting ttyd as
# root and wrapping every client in `sudo -u` leaves stale sudo supervisors
# after websocket disconnects, eventually exhausting --max-clients.
User=jclee
Group=jclee
Environment=HOME=/home/jclee

# The packaged unit uses KillMode=process. Clean the full service cgroup so a
# restart cannot preserve client processes from the previous ttyd instance.
KillMode=control-group
